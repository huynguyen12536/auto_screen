browser:
  name: chrome
  # playwright = real Chromium window; screenshot/interact still works when minimized
  # desktop = old mss/pygetwindow path (needs visible, non-minimized window)
  engine: playwright
  # false = open a real browser window (user may minimize it anytime)
  # true  = no window at all (fully invisible headless)
  headless: false
  guest: true
  viewport:
    width: 1920
    height: 1080
  # Wait until this CSS selector is visible before screenshot/login.
  ready_selector: ".mainContainer"
  ready_timeout_ms: 120000

timing:
  browser_start_timeout: 120
  page_load_delay: 1
  action_delay: 0.35
  human:
    enabled: true
    min_time: 0.25
    max_time: 1.2
    mean: 0.45
    std_dev: 0.15

logging:
  level: INFO
